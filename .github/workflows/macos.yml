name: macOS Build & Test

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the tests, for an urgent release"
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  BUILD_DIR: build/clang_release

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkgconf \
            llvm@23 \
            imagemagick \
            librsvg \
            gnu-tar

      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # libc++ and the libraries, built with llvm@23 (scripts/macos/build_dependencies.sh).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/nui-sftp/macos-dependencies
          key: macos-dependencies-${{ runner.arch }}-${{ hashFiles('scripts/macos/build_dependencies.sh', '_cmake/macos/toolchain.cmake') }}

      - name: Build dependencies
        run: |
          bash scripts/macos/build_dependencies.sh

      - name: Configure CMake
        run: |
          cmake \
            -B "${{ env.BUILD_DIR }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_EXTENSIONS=on \
            -DCMAKE_CXX_STANDARD=23 \
            -DJSON_Diagnostics=ON \
            -DNUI_FETCH_TRAITS=OFF \
            -DNUI_ENABLE_TESTS=off \
            -DNUI_BUILD_EXAMPLES=off \
            -DCMAKE_TOOLCHAIN_FILE=_cmake/macos/toolchain.cmake \
            -DNUI_SFTP_ENABLE_TESTING=ON

      - name: Build
        id: build
        run: |
          cmake --build \
            "${{ env.BUILD_DIR }}" \
            --config "${{ env.BUILD_TYPE }}"

      - name: Run Deploy
        run: |
          bash scripts/deploy.sh

      - name: Read version information
        run: |
          VERSION_FILE="${{ env.BUILD_DIR }}/text/version.txt"
          echo "VERSION=$(sed -n '1p' "$VERSION_FILE")" >> "$GITHUB_ENV"

      - name: Pack app bundle
        run: |
          cd build/install && ditto -c -k --keepParent nui-sftp.app "nui-sftp-macos-arm64_${{ env.VERSION }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: nui-sftp-macos-arm64
          path: build/install/nui-sftp-macos-arm64_${{ env.VERSION }}.zip

      # After the upload, so a failing test marks the release run red without holding back the bundle.
      # The macOS runners have no docker: the containerized shells skip and stay covered by the
      # Arch Linux job, the host's own bash and zsh still run.
      - name: Run Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.skip_tests }}
        env:
          NUI_SFTP_SKIP_DOCKER_TESTS: "1"
        run: |
          ctest \
            --test-dir "${{ env.BUILD_DIR }}" \
            --build-config "${{ env.BUILD_TYPE }}" \
            --output-on-failure \
            --timeout 300 \
            --repeat until-pass:3
