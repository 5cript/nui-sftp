Include /etc/proftpd/modules.conf
<IfModule !mod_tls.c>
  LoadModule mod_tls.c
</IfModule>

ServerName "nui-sftp-ftp-test-proftpd"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
User nobody
Group nogroup
Umask 022 022
MaxInstances 200
AllowOverwrite on
RequireValidShell off
UseReverseDNS off
<IfModule mod_ident.c>
  IdentLookups off
</IfModule>
<IfModule mod_delay.c>
  DelayEngine off
</IfModule>
WtmpLog off
PassivePorts 30000 30049
TimeoutNoTransfer 600
TimeoutStalled 600
SystemLog /var/log/proftpd/proftpd.log
TransferLog /var/log/proftpd/xferlog
Include /etc/nui-sftp/variant.conf

<IfModule mod_tls.c>
  TLSEngine on
  TLSLog /var/log/proftpd/tls.log
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/certs/ftp-test.pem
  TLSRSACertificateKeyFile /etc/ssl/private/ftp-test.key
  TLSVerifyClient off
  TLSRequired off
</IfModule>

<VirtualHost 0.0.0.0>
  Port 990
  ServerName "nui-sftp-ftp-test-proftpd implicit"
  Umask 022 022
  AllowOverwrite on
  RequireValidShell off
  PassivePorts 30050 30099
  TransferLog /var/log/proftpd/xferlog
  Include /etc/nui-sftp/variant.conf
  <IfModule mod_tls.c>
    TLSEngine on
    TLSLog /var/log/proftpd/tls.log
    TLSProtocol TLSv1.2 TLSv1.3
    TLSRSACertificateFile /etc/ssl/certs/ftp-test.pem
    TLSRSACertificateKeyFile /etc/ssl/private/ftp-test.key
    TLSVerifyClient off
    TLSRequired on
    TLSOptions UseImplicitSSL
  </IfModule>
</VirtualHost>
