listen=YES
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
seccomp_sandbox=NO
pasv_enable=YES
data_connection_timeout=600
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=YES
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/certs/ftp-test.pem
rsa_private_key_file=/etc/ssl/private/ftp-test.key
xferlog_enable=YES
secure_chroot_dir=/var/run/vsftpd/empty
